# Dependabot abre un PR cuando una dependencia tiene una version nueva o un
# aviso de seguridad. Los de seguridad llegan aunque el limite este lleno.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
