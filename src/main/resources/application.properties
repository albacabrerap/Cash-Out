spring.application.name=Check-Out

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ---------------------------------------------------------------------------
# Esquema: lo crea Flyway, Hibernate solo lo comprueba
#
# validate no toca la base: compara el esquema con las entidades y, si no
# cuadran, la aplicacion no arranca. Ese fallo ruidoso es justo lo que se quiere,
# porque la alternativa es que Hibernate decida por su cuenta que ALTER ejecutar
# sobre datos reales, o que create-drop borre la base entera en cada reinicio —y
# un contenedor se reinicia por cada release, cada health check fallido y cada
# reescalado.
#
# Ahora es el mismo valor en todos los perfiles, incluido dev, y eso es
# deliberado: si en local el esquema lo generara Hibernate y en el despliegue lo
# generara Flyway, una diferencia entre las dos solo aparecería al desplegar.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}

# Flyway aplica las migraciones de db/migration antes de que Hibernate valide.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

# Para una base que ya tiene tablas pero todavia no tiene historial: en vez de
# fallar, Flyway la marca como version base y sigue desde la siguiente
# migracion. Sin esto, cualquier entorno anterior a Flyway —el compose local de
# cualquiera del equipo— tendria que borrarse para poder arrancar.
# En una base vacia no cambia nada: no hay que marcar, se aplica V1 y ya.
spring.flyway.baseline-on-migrate=true

# El log de SQL es util mientras se desarrolla y ruido en cualquier otro lado:
# llena el log y expone los valores de cada consulta, datos de usuario incluidos.
# Por eso el default es false y lo enciende quien lo necesita.
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
# Las dos propiedades que estaban aqui, defer-datasource-initialization=true y
# sql.init.mode=always, se quitaron: no habia ningun data.sql ni schema.sql que
# inicializar, asi que no hacian nada util, y la primera aplaza la
# inicializacion de la base hasta despues de crear el EntityManagerFactory.
# Eso es justo lo contrario de lo que Flyway necesita — migrar primero y
# validar despues.

# Sin esto Boot deja la sesion de Hibernate abierta durante el renderizado de la
# respuesta, asi que una relacion LAZY puede dispararse fuera del servicio. El
# efecto practico es que un N+1 deja de fallar y pasa a ser invisible: el codigo
# parece correcto y la base recibe una consulta por elemento.
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# JWT
#
# Ninguno tiene valor por defecto: un secreto de firma con default acaba
# usandose en produccion sin que nadie lo note, y con el cualquiera que lea el
# repositorio puede emitirse un token valido. Sin default, el arranque falla con
# un mensaje claro.
#
# El secreto debe tener al menos 32 caracteres, porque HS256 exige 256 bits.
# Generar uno con:  openssl rand -base64 48
#
# Las dos expiraciones van en formato ISO-8601 de duracion (PT15M, P30D). El
# token de acceso es corto porque viaja en cada peticion y no se puede revocar;
# el de refresco es largo pero vive en la base y si se revoca.
# ---------------------------------------------------------------------------
jwt.secret=${JWT_SECRET}
jwt.expiration-access=${JWT_EXPIRATION_ACCESS}
jwt.expiration-refresh=${JWT_EXPIRATION_REFRESH}

# Origenes permitidos por CORS, separados por coma. No se usa "*": con
# credenciales el navegador lo rechaza, y abrir la API a cualquier origen deja
# que cualquier pagina haga peticiones en nombre del usuario.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
# Credenciales del servidor de correo.
#
# Antes estaban como texto literal en este archivo. Aunque fueran marcadores de
# posicion y no credenciales reales, el sitio donde acaba escribiendose la
# contrasena buena es justo ese, y entonces viaja al repositorio. Con default
# vacio la aplicacion arranca sin configurarlas y solo falla al enviar un correo,
# que es el momento correcto para enterarse.
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------------------------------------------------------------------------
# Subida de archivos
#
# El adjunto de un correo viaja como multipart, y el limite por defecto de Boot
# es 1 MB por archivo. Sin subirlo, el tope de 5 MB que comprueba el controller
# no se alcanzaria nunca: la peticion moriria antes con un error del contenedor.
# El maximo de la peticion es algo mayor para dejar sitio a los otros campos.
# ---------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------------------------------------------------------------------------
# Documentacion de la API
#
# Swagger describe cada endpoint, su cuerpo y sus codigos de error. Es util
# durante el desarrollo y es un mapa del ataque en produccion, asi que el default
# lo deja apagado y el entorno de desarrollo lo enciende.
# ---------------------------------------------------------------------------
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# ---------------------------------------------------------------------------
# Zona horaria del negocio
#
# Decide que dia es "hoy" para las reglas (vencimiento de metas, @Past y
# @Future). El servidor corre en UTC; ver TimeConfig.
# ---------------------------------------------------------------------------
app.time-zone=${APP_TIME_ZONE:America/Lima}

# ---------------------------------------------------------------------------
# Datos de mercado (Alpaca)
#
# Sin claves la aplicacion arranca igual: el catalogo queda con los activos
# cargados a mano y lo que dependa del proveedor responde 503. Las claves solo
# viven en el backend; nunca en el frontend. Ver AlpacaProperties.
# ---------------------------------------------------------------------------
alpaca.api-key=${ALPACA_API_KEY:}
alpaca.api-secret=${ALPACA_API_SECRET:}
alpaca.feed=${ALPACA_FEED:iex}

market.quote-ttl=PT15S
market.trading-quote-max-age=PT15M
market.history-years=5
market.history-refresh=PT6H
market.sync-catalog-on-startup=true

# ---------------------------------------------------------------------------
# Cripto (Coinbase)
#
# API publica: no usa claves. Al arrancar se cargan los pares y se abre el
# WebSocket de precios en vivo. Ver CoinbaseProperties.
# ---------------------------------------------------------------------------
coinbase.enabled=${COINBASE_ENABLED:true}
# Las 25 con mas volumen en dolares de los ultimos 30 dias (17/10/2026), sin
# monedas estables ni versiones envueltas de otras monedas.
coinbase.products=BTC-USD,ETH-USD,XRP-USD,ZEC-USD,SOL-USD,NEAR-USD,SUI-USD,QNT-USD,HYPE-USD,LINK-USD,\
  ADA-USD,AVAX-USD,DOGE-USD,UNI-USD,HBAR-USD,ONDO-USD,XLM-USD,TAO-USD,LTC-USD,PUMP-USD,AERO-USD,VVV-USD,\
  ENA-USD,AAVE-USD,BCH-USD

# Carrera de trading: un paso cada 250 ms, 4 velas de un minuto por segundo.
race.tick-ms=250
