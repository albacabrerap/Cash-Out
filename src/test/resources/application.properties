# Perfil de test: base en memoria, sin Docker.
# Hibernate genera el esquema completo a partir de las entidades, de modo que
# cualquier mapeo invalido rompe el build en vez de aparecer en produccion.
spring.datasource.url=jdbc:h2:mem:checkout;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.docker.compose.enabled=false

# Flyway apagado aqui, y conviene saber lo que eso cuesta.
#
# Las migraciones de db/migration son SQL de PostgreSQL —columnas identity,
# tipos numeric, sintaxis de constraints— y H2, aunque corra en MODE=PostgreSQL,
# no las acepta todas. Correrlas aqui haria fallar la suite por diferencias de
# dialecto y no por defectos del codigo.
#
# El precio es que las migraciones NO se prueban en el build: una V2 mal escrita
# pasaria el CI y fallaria al desplegar. Mientras eso sea asi, toda migracion
# nueva se prueba a mano contra el compose antes de subirla:
#   docker compose down -v && docker compose up --build
# La forma de cerrarlo de verdad es Testcontainers con un PostgreSQL real, que
# es una dependencia mas y un CI mas lento; queda pendiente de decidir.
spring.flyway.enabled=false

# Igual que en produccion, y por eso esta repetido aqui: si se dejara el default
# de Boot, los tests correrian con la sesion abierta durante el renderizado y una
# relacion LAZY resuelta fuera del servicio pasaria en verde para fallar solo en
# el despliegue. Con esto, el build es lo que detecta ese caso.
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Configuracion de seguridad para los tests.
#
# Este archivo sombrea por completo al de src/main/resources: los dos se llaman
# application.properties y el classpath de test gana. Por eso hay que repetir
# aqui todas las claves que la aplicacion necesita para arrancar, no solo las
# que cambian.
#
# El secreto no es sensible: firma tokens que viven dentro de una JVM que muere
# al terminar la suite. En cualquier otro entorno llega por JWT_SECRET, y sin
# esa variable la aplicacion no arranca a proposito.
# ---------------------------------------------------------------------------
jwt.secret=clave-de-pruebas-que-supera-los-32-caracteres-exigidos
jwt.expiration-access=PT15M
jwt.expiration-refresh=P30D
cors.allowed-origins=http://localhost:*

# ---------------------------------------------------------------------------
# Correo
#
# MailConfig las lee con @Value sin valor por defecto, asi que sin declararlas
# aqui no se resuelve el placeholder y el contexto no arranca. Este archivo
# sombrea por completo al de src/main/resources, de modo que hay que repetir
# toda clave que la aplicacion necesite, no solo las que cambian.
#
# No son credenciales: en los tests no se envia ningun correo de verdad.
# ---------------------------------------------------------------------------
# spring.mail.host tiene que estar aunque nada se envie: Boot autoconfigura el
# JavaMailSender solo si esta presente, y sin ese bean no arranca el contexto.
# Apunta a localhost y no se usa: los tests sustituyen el sender por un doble.
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=checkout@utec.edu.pe
spring.mail.password=sin-uso-en-tests

# La carrera avanza a mano en los tests (RaceService.tick), no con el reloj.
race.tick-ms=3600000
